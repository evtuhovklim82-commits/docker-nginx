# HTTP → HTTPS редирект
server {
    listen 80;
    server_name grafana.local;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name grafana.local;

    ssl_certificate     /etc/nginx/ssl/grafana.local.crt;
    ssl_certificate_key /etc/nginx/ssl/grafana.local.key;

    location / {
        # Отложенный DNS-резолв — заработает только в runtime
        resolver 127.0.0.11 valid=30s ipv6=off;

        # Адрес в переменной — nginx не резолвит его при старте
        set $grafana_upstream http://host.docker.internal:3000;

        proxy_pass $grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
